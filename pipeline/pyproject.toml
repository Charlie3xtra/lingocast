[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lingocast-pipeline"
version = "0.1.0"
description = "Reusable video-to-course-pack ingestion pipeline for LingoCast Android English listening/reading app"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "rapidocr-onnxruntime",
    "simplemma",
    "pillow",
    "pydantic>=2.6",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "imageio-ffmpeg>=0.5",
    "yt-dlp",
]

[project.scripts]
lingocast = "lingocast.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["lingocast*"]
